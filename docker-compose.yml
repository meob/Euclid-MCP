services:
  # MCP stdio mode — for local MCP clients (OpenCode, Claude, etc.)
  # Usage: docker compose run --rm euclid-mcp
  euclid-mcp:
    build: .
    image: euclid-mcp:latest
    stdin_open: true
    restart: "no"

  # HTTP API mode — for n8n, Zapier, remote clients
  # Usage: docker compose up euclid-api
  euclid-api:
    build: .
    image: euclid-mcp:latest
    command: ["python3", "integrations/euclid_api.py", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      # Require `Authorization: Bearer <key>` on every POST (see docs/PRODUCTION.md):
      EUCLID_API_KEY: ${EUCLID_API_KEY:-}
      # Serve HTTPS directly (uncomment + mount ./certs):
      # EUCLID_TLS_CERT: /certs/cert.pem
      # EUCLID_TLS_KEY: /certs/key.pem
    # volumes:
    #   - ./certs:/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - euclid-app

networks:
  # Shared by the monitoring stack (see monitoring/docker-compose.monitoring.yml).
  euclid-app:
    name: euclid-app
