name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            backend: prolog
          - python-version: "3.11"
            backend: prolog
          - python-version: "3.12"
            backend: prolog
          - python-version: "3.13"
            backend: prolog
          - python-version: "3.14"
            backend: prolog
          - python-version: "3.12"
            backend: native

    steps:
      - uses: actions/checkout@v7

      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install package and dev dependencies (uv.lock)
        run: uv sync --frozen --all-packages --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy euclid_mcp integrations

      - name: Test with coverage
        env:
          EUCLID_BACKEND: ${{ matrix.backend }}
        run: uv run pytest --cov=euclid_mcp --cov=integrations --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
