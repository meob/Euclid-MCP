[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euclid-lsp"
version = "0.4.5"
description = "LSP server for Euclid-IR — real-time diagnostics, autocomplete, and hover"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Euclid-MCP contributors" }
]
keywords = ["lsp", "euclid-ir", "prolog", "logic", "vscode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "euclid-mcp",
    "pygls>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
euclid-lsp = "euclid_lsp.server:main"

[tool.setuptools.packages.find]
include = ["euclid_lsp*"]

[tool.setuptools.package-data]
euclid_lsp = ["../grammars/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99
exclude = ["sublime-text"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.uv.sources]
euclid-mcp = { workspace = true }
